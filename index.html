<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef4f4" />
    <link rel="icon" href="data:," />
    <title>Novel Reader</title>
    <script>
      // Apply the saved theme before first paint so dark themes don't flash light.
      // Mirrors resolveTheme in src/lib/theme.ts.
      (function () {
        var theme = 'system';
        try {
          theme = JSON.parse(localStorage.getItem('novel-reader:prefs') || '{}').theme || 'system';
        } catch (e) {}
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
